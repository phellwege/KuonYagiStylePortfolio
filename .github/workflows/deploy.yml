name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio4.0/package-lock.json

      - name: Install dependencies
        working-directory: portfolio4.0
        run: npm ci

      - name: Build
        working-directory: portfolio4.0
        run: npm run build
        env:
          # CRA treats lint warnings as errors when CI=true; match local build behavior
          CI: "false"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio4.0/build
